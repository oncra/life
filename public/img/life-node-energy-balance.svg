<g transform="translate(64,446)" font-size="11.5"><rect x="0" y="-9" width="11" height="3" rx="1.5" fill="#2a78d6"/><text x="18" y="-4" fill="#52514e">100 Wp, shaded</text><rect x="122" y="-9" width="11" height="3" rx="1.5" fill="#eb6834"/><text x="140" y="-4" fill="#52514e">50 Wp, shaded</text><rect x="240" y="-9" width="11" height="3" rx="1.5" fill="#111111"/><text x="258" y="-4" fill="#52514e">node load (dashed: full day, dotted: core), incl. a 4.6 Wh/day floor</text></g>
<text x="64" y="464" font-size="11.5" fill="#111111">Winter is not the problem. With two waking hours from November to February the node eats</text>
<text x="64" y="479" font-size="11.5" fill="#111111">11 Wh/day, and even a 50 Wp panel harvests 40 to 60 in those months.</text>
<text x="64" y="494" font-size="11.5" fill="#111111">Under a canopy the 50 Wp line falls short of the full day in late summer but carries the core: the extra hours go first.</text>
<text x="64" y="509" font-size="11.5" fill="#111111">The panel is sized by the crop that shades it, not by December.</text>
