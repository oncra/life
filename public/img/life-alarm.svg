<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 770" width="1040" height="770" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1d2a24">
  <title>Life node alarm: the panel loop and a tilt switch hold a P-channel transistor off; open, it sounds the siren, tells the Pi and wakes it</title>
  <rect width="1040" height="770" fill="#fbfaf6"/>
  <text x="250" y="34" font-size="18" font-weight="bold">Life node alarm: panel loop and tilt switch, one transistor</text>
  <text x="250" y="56" font-size="13">Loop closed: silent, 13 µA. Loop cut, or the box tipped: after about a second the siren sounds for as</text>
  <text x="250" y="73" font-size="13">long as it stays open, and its rising edge wakes a sleeping node to report it. No chip, no firmware.</text>

  <g stroke="#1d2a24" stroke-width="2" fill="none" stroke-linecap="round">
    <!-- +12 V after the fuse -->
    <path d="M128 290 H870 M920 290 H1000"/>
    <rect x="870" y="278" width="50" height="24" rx="12"/>
    <path d="M877 290 H913" stroke-width="1.5"/>
    <!-- ground -->
    <path d="M470 700 H1000"/>
    <!-- the loop: one leg to +12 V, the other through the tilt switch to the gate -->
    <path d="M128 152 V290"/>
    <path d="M128 152 A8 8 0 0 0 112 152"/>
    <path d="M112 152 V310 M112 370 V400 H630"/>
    <rect x="87" y="310" width="50" height="60" rx="6"/>
    <path d="M97 352 L127 328" stroke-width="1.5"/>
    <!-- C1, gate to source -->
    <path d="M560 290 V339 M560 351 V400"/>
    <path d="M538 339 H582 M538 351 H582" stroke-width="3"/>
    <!-- R1, gate to ground -->
    <path d="M470 400 V500 M470 560 V700"/>
    <rect x="460" y="500" width="20" height="60"/>
    <!-- P-channel MOSFET -->
    <rect x="630" y="360" width="80" height="80" rx="4"/>
    <path d="M670 360 V290 M670 440 V480"/>
    <!-- drain line: siren, the Pi's line, the wake -->
    <path d="M670 480 H960"/>
    <path d="M670 480 V520 M670 575 V700"/>
    <path d="M652 520 H688 L702 575 H638 Z"/>
    <!-- the Pi's line: 1 M + 1 M down to the tap, 470 k to ground -->
    <path d="M780 480 V495 M780 535 V550 M780 590 V625 M780 665 V700"/>
    <rect x="770" y="495" width="20" height="40"/>
    <rect x="770" y="550" width="20" height="40"/>
    <rect x="770" y="625" width="20" height="40"/>
    <path d="M780 607 H840" stroke-dasharray="7 5"/>
    <!-- the wake: 2.2 uF and 470 k up to the lead -->
    <path d="M960 480 V460 M960 448 V420 M960 360 V330"/>
    <path d="M938 460 H982 M938 448 H982" stroke-width="3"/>
    <rect x="950" y="360" width="20" height="60"/>
    <path d="M960 330 H1010" stroke-dasharray="7 5"/>
  </g>

  <!-- the panel and its frame tab -->
  <g stroke="#1d2a24" stroke-width="2">
    <rect x="30" y="22" width="190" height="96" fill="#dfe8e2"/>
    <path d="M60 22 V118 M90 22 V118 M120 22 V118 M150 22 V118 M180 22 V118" stroke-width="1" stroke="#9fb3a7"/>
    <rect x="102" y="118" width="36" height="48" fill="#c9cfcb"/>
  </g>
  <circle cx="120" cy="152" r="10" fill="#fbfaf6" stroke="#1d2a24" stroke-width="1.5"/>
  <path d="M128 152 A8 8 0 0 0 112 152" stroke="#1d2a24" stroke-width="2.5" fill="none"/>
  <text x="125" y="75" font-size="13" text-anchor="middle">solar panel</text>
  <text x="146" y="150" font-size="12">frame hole</text>
  <text x="140" y="180" font-size="12" fill="#55645b">one 2-core cable: at the frame</text>
  <text x="140" y="196" font-size="12" fill="#55645b">one core goes through the hole,</text>
  <text x="140" y="212" font-size="12" fill="#55645b">and the two are soldered shut</text>
  <path d="M30 245 H96 M144 245 H240" stroke="#7a8a80" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="98" y="237" width="44" height="16" rx="3" fill="#e9ece6" stroke="#7a8a80" stroke-width="1.5"/>
  <path d="M112 237 V253 M128 237 V253" stroke="#1d2a24" stroke-width="2"/>
  <text x="150" y="232" font-size="12" fill="#55645b">box wall, the spare M20 gland</text>

  <!-- junctions and terminals -->
  <g fill="#1d2a24">
    <circle cx="560" cy="290" r="4"/><circle cx="670" cy="290" r="4"/>
    <circle cx="470" cy="400" r="4"/><circle cx="560" cy="400" r="4"/>
    <circle cx="670" cy="480" r="4"/><circle cx="780" cy="480" r="4"/><circle cx="780" cy="607" r="4"/>
    <circle cx="470" cy="700" r="0"/><circle cx="670" cy="700" r="4"/><circle cx="780" cy="700" r="4"/>
    <circle cx="1003" cy="290" r="5"/><circle cx="1003" cy="700" r="5"/>
  </g>
  <circle cx="844" cy="607" r="4" fill="#fbfaf6" stroke="#1d2a24" stroke-width="1.5"/>
  <circle cx="1014" cy="330" r="4" fill="#fbfaf6" stroke="#1d2a24" stroke-width="1.5"/>

  <!-- labels -->
  <text x="1000" y="276" font-size="13" text-anchor="end">load +</text>
  <text x="1000" y="726" font-size="13" text-anchor="end">load −</text>
  <text x="895" y="250" font-size="12" text-anchor="middle">fuse 1 A</text>
  <text x="895" y="266" font-size="12" text-anchor="middle" font-weight="bold">out = alarm off</text>
  <text x="300" y="282" font-size="12" fill="#55645b">+12 V after the fuse</text>
  <text x="300" y="392" font-size="12" fill="#55645b">gate: the closed loop holds it at +12 V</text>
  <text x="146" y="330" font-size="12">tilt switch, upright on</text>
  <text x="146" y="346" font-size="12">the plate: its S and −</text>
  <text x="146" y="362" font-size="12">pins sit in the loop</text>
  <text x="530" y="350" font-size="13" text-anchor="end">2.2 µF</text>
  <text x="488" y="535" font-size="13">1 M</text>
  <text x="670" y="398" font-size="12" text-anchor="middle">IRF9540N</text>
  <text x="670" y="414" font-size="10" text-anchor="middle">P-channel</text>
  <text x="678" y="354" font-size="11">S</text><text x="616" y="394" font-size="11">G</text><text x="678" y="456" font-size="11">D</text>
  <text x="722" y="380" font-size="12">legs G D S,</text>
  <text x="722" y="396" font-size="12">text towards you</text>
  <text x="630" y="545" font-size="13" text-anchor="end">siren PS-583Q</text>
  <text x="630" y="561" font-size="12" text-anchor="end">red to D, black to −</text>
  <text x="798" y="520" font-size="13">1 M</text>
  <text x="798" y="575" font-size="13">1 M</text>
  <text x="798" y="650" font-size="13">470 k</text>
  <text x="852" y="604" font-size="13">to the Pi: header pin 19</text>
  <text x="852" y="620" font-size="12">(GPIO 10), reads it;</text>
  <text x="852" y="636" font-size="12" fill="#55645b">no ground lead to the header</text>
  <text x="930" y="459" font-size="13" text-anchor="end">2.2 µF</text>
  <text x="940" y="395" font-size="13" text-anchor="end">470 k</text>
  <text x="944" y="326" font-size="13" text-anchor="end">wake: one lead to the visit</text>
  <text x="944" y="342" font-size="12" text-anchor="end">contact's Q1 base (step 3.8)</text>
  <text x="30" y="752" font-size="13">Resistors: three of 1 MΩ (brown black green) and two of 470 kΩ (yellow violet yellow). Capacitors: two of 2.2 µF film.</text>
</svg>
