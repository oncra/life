<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" font-family="Inter,Helvetica,Arial,sans-serif">
<style>.h{font-size:22px;font-weight:700;fill:#131c28}.s{font-size:14px;fill:#333}.b{font-size:15px;font-weight:600;fill:#131c28}.c{text-anchor:middle}.r{text-anchor:end}.i{font-style:italic;fill:#777}.box{fill:#f4f6f8;stroke:#55606b;stroke-width:1.5}.port{fill:#c9d0d6;stroke:#55606b}.usb{stroke:#888;stroke-width:6;fill:none}.lead{stroke:#5b6670;stroke-width:6;fill:none;stroke-dasharray:14 6}.cable{stroke:#222;stroke-width:5;fill:none;stroke-linecap:round}.moth{fill:#2f8f4e;stroke:#1d5c32;stroke-width:1.5}.part{fill:#d9d9d9;stroke:#555}.wall{fill:#7d8b74;stroke:#4f5a49}.hood{fill:none;stroke:#4f5a49;stroke-width:5;stroke-linecap:round}.wave{fill:none;stroke:#8a5cc2;stroke-width:2.5;stroke-linecap:round}.note{fill:#fff8e1;stroke:#d8b44a}</style>
<rect width="100%" height="100%" fill="#fff"/>
<text x="30" y="40" class="h">The bat microphone: an AudioMoth USB Microphone on the Pi</text>
<text x="30" y="62" class="s">Pi off while plugging. Every USB port of the Pi is now in use: two parts on short extension leads, two on their own.</text>

<rect x="30" y="95" width="170" height="330" rx="8" class="box"/>
<text x="115" y="125" class="c b">Raspberry Pi 4</text>
<text x="115" y="145" class="c s">with the Witty Pi</text>
<text x="115" y="245" class="c s i">two stacks of</text>
<text x="115" y="263" class="c s i">two USB ports</text>
<rect x="190" y="150" width="26" height="26" class="port"/>
<rect x="190" y="190" width="26" height="26" class="port"/>
<rect x="190" y="300" width="26" height="26" class="port"/>
<rect x="190" y="340" width="26" height="26" class="port"/>

<path d="M216,163 H330" class="usb"/>
<rect x="330" y="140" width="200" height="46" rx="6" class="box"/>
<text x="430" y="161" class="c b">USB screw terminal</text><text x="430" y="178" class="c s">probe power, straight in</text>

<path d="M216,203 H260" class="usb"/><path d="M260,203 H330" class="lead"/>
<rect x="330" y="196" width="200" height="46" rx="6" class="box"/>
<text x="430" y="217" class="c b">RS485 adapter</text><text x="430" y="234" class="c s">probe data, on a short lead</text>

<path d="M216,313 H260" class="usb"/><path d="M260,313 H330" class="lead"/>
<rect x="330" y="290" width="200" height="46" rx="6" class="box"/>
<text x="430" y="311" class="c b">4G stick</text><text x="430" y="328" class="c s">on the other short lead</text>

<path d="M216,353 H468 V418" class="cable"/>
<text x="232" y="380" class="s">its own USB cable:</text>
<text x="232" y="398" class="s">USB-A to micro-USB, 30 cm</text>
<text x="476" y="400" class="s" style="font-size:12px">micro-USB</text>

<rect x="446" y="430" width="160" height="180" rx="8" class="moth"/>
<rect x="456" y="418" width="24" height="14" class="part"/>
<rect x="514" y="420" width="18" height="12" rx="3" fill="#222"/>
<text x="458" y="470" class="b" style="fill:#fff">AudioMoth</text>
<text x="458" y="490" class="s" style="fill:#e6f2ea">USB Mic</text>
<text x="458" y="508" class="s" style="fill:#e6f2ea">35 × 40 mm</text>
<text x="458" y="528" class="s" style="fill:#e6f2ea;font-size:12px">seen from</text>
<text x="458" y="543" class="s" style="fill:#e6f2ea;font-size:12px">the logo side</text>
<rect x="600" y="540" width="12" height="30" rx="2" fill="#e6f2ea" stroke="#1d5c32"/><rect x="602" y="542" width="8" height="9" rx="1" fill="#1d5c32"/>
<text x="620" y="550" class="s" style="font-size:12px">DEFAULT  ← the switch here</text>
<text x="620" y="566" class="s" style="font-size:12px;fill:#777">USB/OFF, CUSTOM</text>
<text x="620" y="434" class="s" style="font-size:12px">3.5 mm jack: leave empty.</text>
<text x="620" y="450" class="s" style="font-size:12px">The microphone symbol and the</text>
<text x="620" y="466" class="s" style="font-size:12px">hole beside it mark this jack.</text>
<rect x="545" y="566" width="48" height="28" rx="6" fill="#f2f2f2" stroke="#1d5c32"/>
<rect x="562" y="572" width="14" height="16" fill="#b8892e" stroke="#7a5a1a"/>
<path d="M565.5,572 V588 M569,572 V588 M572.5,572 V588 M562,576 H576 M562,580 H576 M562,584 H576" stroke="#7a5a1a" stroke-width="0.8"/>
<path d="M577,582 L616,596" fill="none" stroke="#333" stroke-width="1"/>
<text x="620" y="600" class="s">the microphone, under the gold</text>
<text x="620" y="617" class="s">mesh below the word AudioMoth</text>
<path d="M569,594 V640" fill="none" stroke="#1d5c32" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="380" y="640" width="292" height="18" class="wall"/>
<rect x="557" y="640" width="24" height="18" fill="#fff"/>
<path d="M545,690 q8,-8 16,0 t16,0 t16,0" class="wave"/>
<path d="M539,708 q8,-8 16,0 t16,0 t16,0 t16,0" class="wave"/>
<text x="690" y="653" class="s">bottom wall of the box</text>
<text x="690" y="680" class="s">an open hole facing down, beside</text>
<text x="690" y="698" class="s">the bird microphone's port. No extra</text>
<text x="690" y="716" class="s">membrane: the board's own mesh is</text>
<text x="690" y="734" class="s">enough, any more cover costs the</text>
<text x="690" y="752" class="s">most at ultrasonic frequencies.</text>

<rect x="640" y="95" width="330" height="320" rx="8" class="note"/>
<text x="660" y="125" class="b">Before it goes in</text>
<text x="660" y="152" class="s">1. The small switch on its edge on</text>
<text x="660" y="170" class="s">   DEFAULT. On USB/OFF it is no</text>
<text x="660" y="188" class="s">   microphone and the Pi hears nothing.</text>
<text x="660" y="214" class="s">2. Use a data cable. A charge-only</text>
<text x="660" y="232" class="s">   cable powers the board but no sound</text>
<text x="660" y="250" class="s">   reaches the Pi.</text>
<text x="660" y="276" class="s">3. It listens at 192 kHz, which covers</text>
<text x="660" y="294" class="s">   the Dutch bats. The box sets that</text>
<text x="660" y="312" class="s">   itself when it starts.</text>
<text x="660" y="338" class="s">4. The microphone is under the gold</text>
<text x="660" y="356" class="s">   mesh below the word AudioMoth: leave</text>
<text x="660" y="374" class="s">   it on. That side faces the hole, the</text>
<text x="660" y="392" class="s">   mesh right above it, nothing between.</text>
<text x="30" y="785" class="s i">The bird microphone (INMP441 on the Witty Pi's header) stays as it is. The AudioMoth listens only from sunset to sunrise.</text>
</svg>
