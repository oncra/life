<circle cx="320" cy="385" r="6" fill="#fbfaf6" stroke="#c9a227" stroke-width="2"/>
<text x="320" y="457" text-anchor="middle" fill="#aeb3b9" font-size="12">sound hole in the middle</text>
<path d="M260,345 L150,345" stroke="#888" stroke-width="5" stroke-linecap="round"/>
<rect x="88" y="332" width="62" height="26" rx="5" fill="#888"/>
<text x="119.0" y="350" text-anchor="middle" fill="#fff" font-weight="bold" font-size="14">pin 9</text>
<circle cx="260" cy="345" r="10" fill="#d9b44a" stroke="#1d1f22" stroke-width="2"/><circle cx="260" cy="345" r="4" fill="#1d1f22"/>
<text x="276" y="350" text-anchor="start" fill="#fff" font-size="13" font-weight="bold">L/R</text>
<path d="M260,385 L150,385" stroke="#2f8f3a" stroke-width="5" stroke-linecap="round"/>
<rect x="88" y="372" width="62" height="26" rx="5" fill="#2f8f3a"/>
<text x="119.0" y="390" text-anchor="middle" fill="#fff" font-weight="bold" font-size="14">pin 35</text>
<circle cx="260" cy="385" r="10" fill="#d9b44a" stroke="#1d1f22" stroke-width="2"/><circle cx="260" cy="385" r="4" fill="#1d1f22"/>
<text x="276" y="390" text-anchor="start" fill="#fff" font-size="13" font-weight="bold">WS</text>
<path d="M260,425 L150,425" stroke="#e2a400" stroke-width="5" stroke-linecap="round"/>
<rect x="88" y="412" width="62" height="26" rx="5" fill="#e2a400"/>
<text x="119.0" y="430" text-anchor="middle" fill="#fff" font-weight="bold" font-size="14">pin 12</text>
<circle cx="260" cy="425" r="10" fill="#d9b44a" stroke="#1d1f22" stroke-width="2"/><circle cx="260" cy="425" r="4" fill="#1d1f22"/>
<text x="276" y="430" text-anchor="start" fill="#fff" font-size="13" font-weight="bold">SCK</text>
<path d="M380,345 L490,345" stroke="#2b6cc4" stroke-width="5" stroke-linecap="round"/>
<rect x="490" y="332" width="62" height="26" rx="5" fill="#2b6cc4"/>
<text x="521.0" y="350" text-anchor="middle" fill="#fff" font-weight="bold" font-size="14">pin 38</text>
<circle cx="380" cy="345" r="10" fill="#d9b44a" stroke="#1d1f22" stroke-width="2"/><circle cx="380" cy="345" r="4" fill="#1d1f22"/>
<text x="364" y="350" text-anchor="end" fill="#fff" font-size="13" font-weight="bold">SD</text>
<path d="M380,385 L490,385" stroke="#d23b2f" stroke-width="5" stroke-linecap="round"/>
<rect x="490" y="372" width="62" height="26" rx="5" fill="#d23b2f"/>
<text x="521.0" y="390" text-anchor="middle" fill="#fff" font-weight="bold" font-size="14">pin 1</text>
<circle cx="380" cy="385" r="10" fill="#d9b44a" stroke="#1d1f22" stroke-width="2"/><circle cx="380" cy="385" r="4" fill="#1d1f22"/>
<text x="364" y="390" text-anchor="end" fill="#fff" font-size="13" font-weight="bold">VDD</text>
<path d="M380,425 L490,425" stroke="#222" stroke-width="5" stroke-linecap="round"/>
<rect x="490" y="412" width="62" height="26" rx="5" fill="#222"/>
<text x="521.0" y="430" text-anchor="middle" fill="#fff" font-weight="bold" font-size="14">pin 6</text>
<circle cx="380" cy="425" r="10" fill="#d9b44a" stroke="#1d1f22" stroke-width="2"/><circle cx="380" cy="425" r="4" fill="#1d1f22"/>
<text x="364" y="430" text-anchor="end" fill="#fff" font-size="13" font-weight="bold">GND</text>
<text x="320" y="513" text-anchor="middle" fill="#1b1f1a" font-size="14">INMP441, about 14 mm across, seen from the side with the hole.</text>
<text x="320" y="532" text-anchor="middle" fill="#6b7268" font-size="13">Boards differ in the order of the six names: read the letters on yours.</text>
<rect x="600" y="262" width="275" height="240" rx="10" fill="#f1efe6" stroke="#d8d4c4"/>
<text x="616" y="290" font-weight="bold" fill="#1b1f1a">First: solder the two pin strips</text>
<text x="616" y="310" fill="#6b7268" font-size="13">The board comes with loose pins.</text>
<rect x="640" y="392" width="190" height="9" rx="2" fill="#1d1f22"/>
<rect x="721" y="379" width="28" height="13" rx="2" fill="#9aa0a6"/>
<rect x="656.5" y="346" width="3" height="62" fill="#b9bcc0"/>
<rect x="649" y="378" width="18" height="14" fill="#e6c860"/>
<path d="M651,401 Q658,412 665,401 Z" fill="#c7c9cc"/>
<rect x="810.5" y="346" width="3" height="62" fill="#b9bcc0"/>
<rect x="803" y="378" width="18" height="14" fill="#e6c860"/>
<path d="M805,401 Q812,412 819,401 Z" fill="#c7c9cc"/>
<text x="735" y="370" text-anchor="middle" fill="#6b7268" font-size="12">chip side</text>
<line x1="735" y1="404" x2="735" y2="418" stroke="#6b7268" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="735" y="432" text-anchor="middle" fill="#6b7268" font-size="12">hole side</text>
<text x="616" y="460" fill="#1b1f1a" font-size="13">Strips on the chip side, long pins up.</text>
<text x="616" y="477" fill="#1b1f1a" font-size="13">Solder on the hole side, then clip the</text>
<text x="616" y="494" fill="#1b1f1a" font-size="13">ends flush: that side lies flat on the port.</text>
<text x="30" y="584" font-size="13" fill="#6b7268">Pin 1 is the corner pin at the end away from the USB sockets. Odd numbers on the inner row, even numbers along the board edge.</text>
</svg>
