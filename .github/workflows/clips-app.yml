# The Life Clips laptop app (clients/clips-app): tested on every push that touches it, and on a tag clips-app-v*
# built for macOS and Windows and attached to that tag's release. Its releases are never marked latest: the node
# image is linked through releases/latest/download/life-node-v1.img.xz, which must keep pointing at the image's release.
name: clips-app

on:
  push:
    # tags need branches beside them, or a branch push would not run this; paths are not checked for a tag
    branches: ["**"]
    tags: ["clips-app-v*"]
    paths:
      - "clients/clips-app/**"
      - ".github/workflows/clips-app.yml"
  pull_request:
    paths:
      - "clients/clips-app/**"
      - ".github/workflows/clips-app.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: clients/clips-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable   # a supported toolchain; go.mod keeps the language at 1.23 and vet flags newer APIs
          cache: false         # nothing to cache: standard library only
      - run: go vet ./...
      - run: go test ./...
      - name: Vet the other systems' code
        if: runner.os == 'Linux'
        shell: bash
        run: |
          GOOS=darwin GOARCH=arm64 go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/clips-app-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: clients/clips-app
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          build() {
            CGO_ENABLED=0 GOOS="$1" GOARCH="$2" go build -trimpath -ldflags "-s -w -X main.version=$TAG" -o "dist/$3" .
          }
          # named for the laptop, not the processor architecture: whoever has an M4 should not need to know that is arm64
          build darwin arm64 life-clips-mac-Apple-M1-or-later
          build darwin amd64 life-clips-mac-Intel
          build windows amd64 life-clips-windows.exe
          (cd dist && sha256sum life-clips-* > SHA256SUMS)
          ls -l dist
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # no backticks in these notes: the heredoc is unquoted so that $TAG expands
            cat > notes.md <<EOF
          The Life Clips laptop app. Take the one file for your laptop:

          | Your laptop | File |
          | :-- | :-- |
          | Mac with an Apple chip (M1, M2, M3, M4 or later) | life-clips-mac-Apple-M1-or-later |
          | Mac with an Intel processor | life-clips-mac-Intel |
          | Windows PC | life-clips-windows.exe |

          Apple menu > About This Mac says which Mac you have: "Chip: Apple M..." or "Processor: Intel". How to start the app the first time, and how a visit goes: [clients/clips-app/README.md](https://github.com/oncra/life/blob/$TAG/clients/clips-app/README.md). SHA256SUMS lists the SHA-256 of each file.
          EOF
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --latest=false \
              --title "Life Clips ${TAG#clips-app-}" --notes-file notes.md
          fi
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
