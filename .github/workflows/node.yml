# The node software (node/, and life-push in clients/birdnet-pi-push.py): its tests on every pull request and every
# push to main that touches it. A node runs Raspberry Pi OS on Debian 13 (trixie), so the tests run on its Python, 3.13,
# with the astral it gets from that archive (python3-astral 3.2) and ffmpeg, both installed by node/provision.sh.
# Without astral the listening-window tests skip, without ffmpeg the tests that cut real sound: both are here so that
# nothing skips.
name: node

on:
  push:
    branches: [main]
    paths:
      - "node/**"
      - "clients/birdnet-pi-push.py"
      - ".github/workflows/node.yml"
  pull_request:
    paths:
      - "node/**"
      - "clients/birdnet-pi-push.py"
      - ".github/workflows/node.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: ffmpeg and astral, as on a node
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          python3 -m pip install --disable-pip-version-check -q astral==3.2
          python3 --version
          ffmpeg -version | head -1
          lscpu | sed -nE 's/^Model name: *//p'   # the processor: how far AAC overshoots a clip's level depends on it
      - name: Node tests
        run: python3 -B -m unittest discover -s node/tests -v
