# Life node: host keys live on /data so they survive the read-only root
HostKey /data/ssh/ssh_host_ed25519_key
HostKey /data/ssh/ssh_host_rsa_key
# A second key that survives a reboot: life-firstboot writes ~/.ssh/authorized_keys anew from NODE_SSH_KEY at every
# boot, so a server in the steward's tailnet that fetches the clip sample has its key in /data/ssh/authorized_keys.life
AuthorizedKeysFile .ssh/authorized_keys /data/ssh/authorized_keys.%u
# SSH that comes in over the tailnet (life-tailscale, userspace networking) arrives from localhost: keys only there
Match Address 127.0.0.1,::1
    PasswordAuthentication no
    KbdInteractiveAuthentication no
